name: ynov-articles
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-ynovlocal}/ynov-articles-web:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-articles}
      DB_USER: ${DB_USER:-articles_app}
      DB_PASSWORD_FILE: /run/secrets/db_password
      APACHE_RUN_DIR: /tmp/apache2
      APACHE_LOCK_DIR: /tmp/apache2
      APACHE_PID_FILE: /tmp/apache2/apache2.pid
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health.php"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    image: ${DOCKERHUB_USERNAME:-ynovlocal}/ynov-articles-db:${IMAGE_TAG:-latest}
    environment:
      MARIADB_DATABASE: ${DB_NAME:-articles}
      MARIADB_USER: ${DB_USER:-articles_app}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
networks:
  app-network:
    driver: bridge
volumes:
  db-data:
secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
